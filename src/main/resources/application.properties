spring.application.name=backend

# mysel config
spring.datasource.url=jdbc:mysql://localhost:3306/database
spring.datasource.username=${username}
spring.datasource.password=${password}

# JPA Config

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update

server.tomcat.max-http-form-post-size=30MB
server.tomcat.max-swallow-size=30MB
spring.codec.max-in-memory-size=30MB

#Spring
spring.security.oauth2.client.registration.google.client-id=${client_id}
spring.security.oauth2.client.registration.google.client-secret=${client_secret}
spring.security.oauth2.client.registration.google.scope=profile,email

#Mail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${email_username}
spring.mail.password=${email_password}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# eSewa (sandbox defaults)
payment.frontend-url=${PAYMENT_FRONTEND_URL:http://localhost:5173}
esewa.form-url=${ESEWA_FORM_URL:https://rc-epay.esewa.com.np/api/epay/main/v2/form}
esewa.status-url=${ESEWA_STATUS_URL:https://rc.esewa.com.np/api/epay/transaction/status/}
esewa.product-code=${ESEWA_PRODUCT_CODE:EPAYTEST}
esewa.secret-key=${ESEWA_SECRET_KEY:}